# Stateful smoke test: data written to a local-path PVC must survive pod deletion.
# local-path volumes are node-local: the PV carries node affinity, so the
# replacement pod is pinned to the same node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-probe
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-probe
  labels:
    app.kubernetes.io/name: storage-probe
    app.kubernetes.io/part-of: lab-smoke
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-probe
        app.kubernetes.io/part-of: lab-smoke
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: k3d-registry.localhost:5001/lab/busybox:1.37.0
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          readinessProbe:
            exec:
              command: ["test", "-w", "/data"]
            periodSeconds: 5
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage-probe
