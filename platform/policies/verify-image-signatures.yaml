# Rollout: validationActions [Audit] first; [Deny] after reports are clean.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify image signatures and SBOM
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Images from ghcr.io/resumepilot360 must be signed (Cosign keyless) by this
      repository's ci.yaml on main and carry a signed CycloneDX SBOM attestation.
      ImageValidatingPolicy (sigstore-go, current trusted root) replaces the
      ClusterPolicy verifyImages rule, whose legacy verifier rejected current
      Fulcio certificates ("x509: certificate signed by unknown authority").
spec:
  validationActions: [Audit]
  evaluation:
    background: {enabled: true}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - {key: kubernetes.io/metadata.name, operator: In, values: [demo-dev, demo-staging, demo-prod]}
  matchImageReferences:
    - glob: "ghcr.io/resumepilot360/*"
  attestors:
    - name: ci
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/resumepilot360/platform-engineering-lab/.github/workflows/ci.yaml@refs/heads/main
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: sbom
      intoto:
        type: https://cyclonedx.org/bom
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.ci])).all(e, e > 0)
      message: image is not signed by ci.yaml on main
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.ci])).all(e, e > 0)
      message: image has no CycloneDX SBOM attestation signed by ci.yaml on main
