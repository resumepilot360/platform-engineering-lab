apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require explicit requests and limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Workloads must declare CPU/memory requests and a memory limit explicitly. LimitRange defaults are applied to Pods before validation, so this is enforced on the pod templates of controllers (Kyverno autogen) where defaults do not apply.
spec:
  background: true
  rules:
    - name: requests-and-memory-limit
      match:
        any:
          - resources: {kinds: [Pod], namespaces: [demo-dev, demo-staging, demo-prod]}
      validate:
        failureAction: Audit
        message: "Every container needs resources.requests.cpu, resources.requests.memory and resources.limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
