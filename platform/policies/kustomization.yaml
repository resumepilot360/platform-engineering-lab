apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Rollout: every rule starts failureAction: Audit; switched to Enforce after
# PolicyReports are clean (see docs/runbooks/policy-enforcement.md).
resources:
  - disallow-privileged-containers.yaml
  - require-run-as-non-root.yaml
  - require-requests-limits.yaml
  - restrict-image-registries.yaml
  - disallow-host-namespaces.yaml
  - disallow-host-path.yaml
  - require-labels.yaml
  - verify-image-signatures.yaml
  - restrict-service-accounts.yaml
