apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-service-accounts
  annotations:
    policies.kyverno.io/title: Restrict ServiceAccounts in app namespaces
    policies.kyverno.io/category: Identity
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Phase 2 finding: anyone who can create pods can run them as any ServiceAccount in the namespace. App pods may only use default or demo-backend, never eso-reader or config-reader.
spec:
  background: true
  rules:
    - name: allowed-service-accounts
      match:
        any:
          - resources: {kinds: [Pod], namespaces: [demo-dev, demo-staging, demo-prod]}
      validate:
        failureAction: Audit
        message: "Pods in app namespaces may only use ServiceAccount default or demo-backend."
        pattern:
          spec:
            =(serviceAccountName): "default | demo-backend"
