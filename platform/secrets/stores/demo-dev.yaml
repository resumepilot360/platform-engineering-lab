# Secret delivery for demo-dev: a dedicated, permissionless ServiceAccount whose
# audience-scoped token ESO presents to OpenBao (role eso-demo-dev → dev mount only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: demo-dev
  labels: {lab.platform/managed-by: platform-team}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: demo-dev
  labels: {lab.platform/managed-by: platform-team}
spec:
  provider:
    vault:                      # OpenBao is API-compatible with ESO's Vault provider
      server: http://openbao.openbao.svc:8200
      path: kv-dev
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-demo-dev
          serviceAccountRef:
            name: eso-reader
            audiences: ["openbao"]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-backend-db
  namespace: demo-dev
  labels: {lab.platform/managed-by: platform-team}
spec:
  refreshInterval: 1m           # rotation propagates to the Kubernetes Secret within ~1m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: demo-backend-db
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/name: demo-backend
          lab.platform/secret-source: openbao
  dataFrom:
    - extract:
        key: demo/backend
