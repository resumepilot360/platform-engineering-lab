# OpenBao Helm values (chart version pinned in local/versions.env).
# Single standalone server with integrated (raft) storage on a local-path PVC.
# Manual unseal (Shamir 3/2) — keys are written to .tools/secrets/ by
# scripts/openbao-bootstrap.sh. On AWS this becomes KMS auto-unseal (ADR-0008).
global:
  tlsDisable: true          # in-cluster plaintext; mitigated by NetworkPolicy in Phase 6 (documented gap)
injector:
  enabled: false            # secrets reach pods via External Secrets, not the sidecar injector
ui:
  enabled: false
server:
  authDelegator:
    enabled: true           # lets OpenBao call TokenReview for Kubernetes auth
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {memory: 256Mi}
  # Root filesystem stays read-only; the entrypoint renders its config into /tmp.
  volumes:
    - name: tmp
      emptyDir: {medium: Memory, sizeLimit: 16Mi}
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
  auditStorage:
    enabled: false          # audit device writes to stdout (collected by Loki in Phase 7)
  statefulSet:
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      container:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
  standalone:
    enabled: true
    config: |
      ui = false
      disable_mlock = true
      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }
      storage "raft" {
        path    = "/openbao/data"
        node_id = "openbao-0"
      }
      # Audit devices are config-only in OpenBao 2.x (API enablement is refused
      # so a token holder cannot point a file device at arbitrary paths).
      audit "file" "stdout" {
        description = "All requests/responses; secret values HMAC'd"
        options {
          file_path = "stdout"
        }
      }
      api_addr     = "http://openbao.openbao.svc:8200"
      cluster_addr = "http://openbao-0.openbao-internal:8201"
