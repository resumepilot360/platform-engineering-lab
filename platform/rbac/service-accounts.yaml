# Workload identities in demo-dev.
#   demo-backend   runtime identity for the app: zero API permissions, no token mounted
#   config-reader  example of a narrowly scoped identity: may read exactly one ConfigMap
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-backend
  namespace: demo-dev
  labels: {lab.platform/managed-by: platform-team}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-reader
  namespace: demo-dev
  labels: {lab.platform/managed-by: platform-team}
automountServiceAccountToken: false     # pods opt in explicitly via a projected token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: demo-dev
  labels: {lab.platform/managed-by: platform-team}
data:
  LOG_LEVEL: info
  FEATURE_FLAGS: "greeting=v1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-app-config
  namespace: demo-dev
  labels: {lab.platform/managed-by: platform-team}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["app-config"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-reader:read-app-config
  namespace: demo-dev
  labels: {lab.platform/managed-by: platform-team}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: read-app-config}
subjects:
  - {kind: ServiceAccount, name: config-reader, namespace: demo-dev}
