# Developers are read-only in staging; changes arrive only through GitOps (Phase 4).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developers:view
  namespace: demo-staging
  labels: {lab.platform/managed-by: platform-team}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "lab:developers"}
