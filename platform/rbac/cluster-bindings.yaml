apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab:platform-admins:view
  labels: {lab.platform/managed-by: platform-team}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "lab:platform-admins"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
