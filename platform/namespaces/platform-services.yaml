# Namespaces for platform-owned services. Same restricted Pod Security as app
# namespaces; no app-style quota (platform components size themselves via values).
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    lab.platform/environment: platform
    lab.platform/managed-by: platform-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    lab.platform/environment: platform
    lab.platform/managed-by: platform-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
