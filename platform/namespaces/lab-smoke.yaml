apiVersion: v1
kind: Namespace
metadata:
  name: lab-smoke
  labels:
    lab.platform/environment: test
    lab.platform/managed-by: platform-team
    # Pod Security Admission: reject anything below "restricted".
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Defaults for containers that omit requests/limits, and per-container ceilings.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: lab-smoke
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: lab-smoke
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "20"
    persistentvolumeclaims: "5"
    requests.storage: 10Gi
    services.nodeports: "0"
    services.loadbalancers: "0"
