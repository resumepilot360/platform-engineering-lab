apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  labels: &labels
    app.kubernetes.io/name: demo-backend
    app.kubernetes.io/part-of: demo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: demo-backend}
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: demo-backend          # no API permissions (platform/rbac)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: demo-backend}
      containers:
        - name: api
          image: demo-backend                   # set per environment by kustomize `images`
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: APP_ENVIRONMENT
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: GREETING
              value: hello
            - name: SECRETS_DIR
              value: /etc/demo-backend/secrets
          readinessProbe:                       # fails until the DB credentials are mounted
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: db-credentials, mountPath: /etc/demo-backend/secrets, readOnly: true}
      volumes:
        # Volume (not env) so ESO rotations reach the pod without a restart.
        - name: db-credentials
          secret:
            secretName: demo-backend-db
            defaultMode: 0400
            items:
              - {key: db_username, path: db_username}
              - {key: db_password, path: db_password}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-backend
  labels: {app.kubernetes.io/name: demo-backend, app.kubernetes.io/part-of: demo}
spec:
  selector: {app.kubernetes.io/name: demo-backend}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-backend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: demo-backend}
