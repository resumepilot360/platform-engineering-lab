# App-of-apps root. Applied once by scripts/cluster-up.sh; it syncs
# gitops/applications, which defines every other Application and AppProject.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/resumepilot360/platform-engineering-lab.git
    targetRevision: main
    path: gitops/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
