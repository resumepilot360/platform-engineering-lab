---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-portal
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "0"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  source:
    repoURL: https://github.com/resumepilot360/platform-engineering-lab.git
    targetRevision: main
    path: platform/portal
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-portal
