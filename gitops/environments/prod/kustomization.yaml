# demo app, prod environment. Changes only via an approved promotion PR from staging,
# then a manual Argo CD sync.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources:
  - ../../../applications/demo-backend/deploy/base
  - ../../../applications/demo-frontend/deploy/base
labels:
  - pairs: {lab.platform/environment: prod}
    includeSelectors: false
    includeTemplates: true
replicas:
  - {name: demo-backend, count: 2}
  - {name: demo-frontend, count: 2}
patches:
  - target: {kind: Ingress, name: demo-frontend}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: demo.prod.lab.localhost
images:
  - name: demo-backend
    newName: ghcr.io/resumepilot360/demo-backend
    digest: sha256:3135a1bedbc6b2475ae8d5e716c5a772b448bd27fc863ba5ca01db76e62d7dbc
  - name: demo-frontend
    newName: ghcr.io/resumepilot360/demo-frontend
    digest: sha256:693cdf769a886134151b26d52016b0e95e4637f634c9b88f713f76675a14156e
components:
  - ../../components/smoke-hook
