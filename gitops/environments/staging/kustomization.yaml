# demo app, staging environment. CI updates the image digests below for dev;
# staging (and later prod) change only through a reviewed promotion PR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-staging
resources:
  - ../../../applications/demo-backend/deploy/base
  - ../../../applications/demo-frontend/deploy/base
labels:
  - pairs: {lab.platform/environment: staging}
    includeSelectors: false
    includeTemplates: true
replicas:
  - {name: demo-backend, count: 2}
  - {name: demo-frontend, count: 2}
patches:
  - target: {kind: Ingress, name: demo-frontend}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: demo.staging.lab.localhost
images:
  - name: demo-backend
    newName: ghcr.io/resumepilot360/demo-backend
    digest: sha256:c6e803c5c4a89119c42a07a39e0540da1a91812118943f15e957da9379adf5c6
  - name: demo-frontend
    newName: ghcr.io/resumepilot360/demo-frontend
    digest: sha256:994681ca6f765d777cdd528569fe9afa0b9eb86010263b9cc9e3135712f71e8c
components:
  - ../../components/smoke-hook
