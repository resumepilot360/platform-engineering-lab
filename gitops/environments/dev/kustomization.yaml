# demo app, dev environment. CI updates the image digests below for dev;
# staging (and later prod) change only through a reviewed promotion PR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
  - ../../../applications/demo-backend/deploy/base
  - ../../../applications/demo-frontend/deploy/base
labels:
  - pairs: {lab.platform/environment: dev}
    includeSelectors: false
    includeTemplates: true
replicas:
  - {name: demo-backend, count: 1}
  - {name: demo-frontend, count: 1}
patches:
  - target: {kind: Ingress, name: demo-frontend}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: demo.dev.lab.localhost
images:
  - name: demo-backend
    newName: ghcr.io/resumepilot360/demo-backend
    digest: sha256:9573634d1c878efcac1ddd0d700bde27ca6a9f73543d813facb5a45d9589d9f7
  - name: demo-frontend
    newName: ghcr.io/resumepilot360/demo-frontend
    digest: sha256:7e53b53ac7c1cf040dd5ef4c07fb9ae69d73d47054f809d58b5c441d982b93e1
components:
  - ../../components/smoke-hook
