# Argo CD PostSync health verification: after every sync, call the frontend
# (which calls the backend, which needs its ESO-delivered DB credentials).
# A failing hook marks the sync as Failed in Argo CD.
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: smoke-test, app.kubernetes.io/part-of: demo}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: smoke
          image: k3d-registry.localhost:5001/lab/busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              for i in $(seq 1 30); do
                if out=$(wget -qO- -T 5 http://demo-frontend/); then break; fi; sleep 4
              done
              echo "$out" | grep -q '<h1>hello, world</h1>'      || { echo "FAIL: greeting missing"; exit 1; }
              echo "$out" | grep -q 'db configured: true'         || { echo "FAIL: backend has no DB credentials"; exit 1; }
              echo "$out" | grep -q "env $POD_NAMESPACE"           || { echo "FAIL: wrong environment"; exit 1; }
              echo "PASS: frontend -> backend -> secrets OK in $POD_NAMESPACE"
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
