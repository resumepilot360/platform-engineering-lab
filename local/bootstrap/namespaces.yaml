# Bootstrap-owned namespaces (applied by scripts/cluster-up.sh before Argo CD exists).
# Everything else is owned by Argo CD — see docs/decisions/0009-gitops-ownership.md.
# namespaces; no app-style quota (platform components size themselves via values).
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    lab.platform/environment: platform
    lab.platform/managed-by: bootstrap
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    lab.platform/environment: platform
    lab.platform/managed-by: bootstrap
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    lab.platform/environment: platform
    lab.platform/managed-by: bootstrap
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    lab.platform/environment: platform
    lab.platform/managed-by: bootstrap
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Documented Pod Security exception: a runtime sensor needs host syscall
# visibility (eBPF capabilities, host mounts). Nothing else runs here.
apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    lab.platform/environment: platform
    lab.platform/managed-by: bootstrap
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
