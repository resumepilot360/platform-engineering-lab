# Overrides for the K3s-bundled Traefik chart (processed by the K3s helm-controller).
# servicelb is disabled, so Traefik is exposed as a NodePort and reached via the
# k3d load balancer on 127.0.0.1:8081 (HTTP) and 127.0.0.1:8443 (HTTPS).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      type: NodePort
    ports:
      web:
        nodePort: 30080
      websecure:
        nodePort: 30443
    # NodePort exposure leaves Ingress .status empty, which Argo CD reads as
    # "Progressing" forever. Publish the real (loopback) endpoint instead —
    # the AWS Load Balancer Controller does the equivalent with the ALB hostname.
    # (The chart default publishes kube-system/traefik's LB status, which is
    # empty for a NodePort Service, so that is turned off.)
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
    additionalArguments:
      - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
